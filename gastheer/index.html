  const workerUrl = 'https://gastheer-mistral.brightsite-826.workers.dev'; // Vervang dit eventueel later door je eigen subdomein of API-route
  
  const messagesDiv = document.getElementById('gastheer-chat-messages');
  const inputField = document.getElementById('gastheer-chat-input');
  const sendButton = document.getElementById('gastheer-chat-send');

  function appendMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.style.padding = '10px 14px';
    msgDiv.style.borderRadius = '6px';
    msgDiv.style.maxWidth = '80%';
    msgDiv.style.fontSize = '14px';
    
    if (sender === 'user') {
      msgDiv.style.alignSelf = 'flex-end';
      msgDiv.style.background = '#3498db';
      msgDiv.style.color = 'white';
    } else {
      msgDiv.style.alignSelf = 'flex-start';
      msgDiv.style.background = '#e2e8f0';
      msgDiv.style.color = '#333';
    }
    msgDiv.textContent = text;
    messagesDiv.appendChild(msgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage() {
    const text = inputField.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    inputField.value = '';

    try {
      const response = await fetch(workerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      
      const data = await response.json();
      const reply = data.reply || data.response || 'Antwoord ontvangen van de bot.';
      appendMessage(reply, 'bot');
    } catch (err) {
      appendMessage('Fout bij het verbinden met de gastheer-bot.', 'bot');
    }
  }

  sendButton.addEventListener('click', sendMessage);
  inputField.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
})();</script></div></article></main><footer id="copyright"><ul><li>© Massively</li><li>Design: <a href="https://html5up.net" target="_blank" rel="nofollow noopener">HTML5 UP</a></li><li>Powered by Publii</li></ul></footer></div><script src="https://emer.be/assets/js/jquery.min.js?v&#x3D;c9771cc3e90e18f5336eedbd0fffb2cf"></script><script src="https://emer.be/assets/js/jquery.scrollex.min.js?v&#x3D;f89065e3d988006af9791b44561d7c90"></script><script src="https://emer.be/assets/js/jquery.scrolly.min.js?v&#x3D;1ed5a78bde1476875a40f6b9ff44fc14"></script><script src="https://emer.be/assets/js/browser.min.js?v&#x3D;c07298dd19048a8a69ad97e754dfe8d0"></script><script src="https://emer.be/assets/js/breakpoints.min.js?v&#x3D;81a479eb099e3b187613943b085923b8"></script><script src="https://emer.be/assets/js/util.min.js?v&#x3D;4201a626f8c9b614a663b3a1d7d82615"></script><script src="https://emer.be/assets/js/main.min.js?v&#x3D;56233c354bd814758be8bff42f7e13a5"></script><script>/*<![CDATA[*/var images=document.querySelectorAll("img[loading]");for(var i=0;i<images.length;i++){if(images[i].complete){images[i].classList.add("is-loaded")}else{images[i].addEventListener("load",function(){this.classList.add("is-loaded")},false)}};/*]]>*/</script></body></html>
