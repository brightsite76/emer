           }</style><noscript><style>img[loading] {

el> <textarea id="emer-message" style="width: 100%; padding: 10px 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; resize: vertical;" required="" rows="6" placeholder="Typ je uitgebreide bericht hier..."></textarea></div><div><label style="display: block; font-size: 13px; margin-bottom: 6px; color: #ccc;" for="emer-photo">Foto toevoegen (alleen afbeeldingen)</label> <input type="file" id="emer-photo" accept="image/*" style="width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #bbb; font-size: 13px; box-sizing: border-box;"></div><div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;"><label style="display: flex; align-items: center; font-size: 14px; color: #ccc; cursor: pointer;"><input type="checkbox" id="emer-check-fan" style="margin-right: 8px; width: 16px; height: 16px; accent-color: #3498db; cursor: pointer;"> Ik ben fan</label> <label style="display: flex; align-items: center; font-size: 14px; color: #ccc; cursor: pointer;"><input type="checkbox" id="emer-check-never" style="margin-right: 8px; width: 16px; height: 16px; accent-color: #3498db; cursor: pointer;"> Dag en tot nooit meer</label></div><button id="emer-submit-btn" style="background: #3498db; color: white; border: none; border-radius: 4px; padding: 12px 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; margin-top: 8px;" type="submit">Bericht versturen</button></form><div id="emer-form-status" style="margin-top: 14px; font-size: 14px; display: none;"></div></div><p><script>(function() {
  const form = document.getElementById('emer-contact-form');
  const statusDiv = document.getElementById('emer-form-status');
  const submitBtn = document.getElementById('emer-submit-btn');
  const photoInput = document.getElementById('emer-photo');
  
  const contactWorkerUrl = 'https://contact-form-handler.brightsite-826.workers.dev';

  // Hulpfunctie om een gekozen bestand om te zetten naar Base64
  function convertFileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const name = document.getElementById('emer-name').value;
    const email = document.getElementById('emer-email').value;
    const message = document.getElementById('emer-message').value;
    const isFan = document.getElementById('emer-check-fan').checked;
    const neverAgain = document.getElementById('emer-check-never').checked;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Bezig met versturen...';
    statusDiv.style.display = 'none';

    try {
      let photoData = null;
      let photoName = null;

      if (photoInput.files && photoInput.files[0]) {
        const file = photoInput.files[0];
        photoName = file.name;
        photoData = await convertFileToBase64(file); // Bevat de Base64 string inclusief data-type
      }

      const payload = {
        name,
        email,
        message,
        isFan,
        neverAgain,
        photo: photoData,
        photoName: photoName,
        recipient: 'brecht@emer.be'
      };

      const response = await fetch(contactWorkerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        statusDiv.style.color = '#2ecc71';
        statusDiv.textContent = 'Bedankt! Je bericht en opties zijn succesvol verzonden.';
        form.reset();
      } else {
        throw new Error('Serverfout');
      }
    } catch (err) {
      statusDiv.style.color = '#e74c3c';
      statusDiv.textContent = 'Oeps, er ging iets mis bij het versturen. Probeer het later opnieuw.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Bericht versturen';
      statusDiv.style.display = 'block';
    }
  });
})();</script></p></div></article></main><footer id="copyright"><ul><li>© Massively</li><li>Design: <a href="https://html5up.net" target="_blank" rel="nofollow noopener">HTML5 UP</a></li><li>Powered by Publii</li></ul></footer></div><script src="https://emer.be/assets/js/jquery.min.js?v&#x3D;c9771cc3e90e18f5336eedbd0fffb2cf"></script><script src="https://emer.be/assets/js/jquery.scrollex.min.js?v&#x3D;f89065e3d988006af9791b44561d7c90"></script><script src="https://emer.be/assets/js/jquery.scrolly.min.js?v&#x3D;1ed5a78bde1476875a40f6b9ff44fc14"></script><script src="https://emer.be/assets/js/browser.min.js?v&#x3D;c07298dd19048a8a69ad97e754dfe8d0"></script><script src="https://emer.be/assets/js/breakpoints.min.js?v&#x3D;81a479eb099e3b187613943b085923b8"></script><script src="https://emer.be/assets/js/util.min.js?v&#x3D;4201a626f8c9b614a663b3a1d7d82615"></script><script src="https://emer.be/assets/js/main.min.js?v&#x3D;56233c354bd814758be8bff42f7e13a5"></script><script>/*<![CDATA[*/var images=document.querySelectorAll("img[loading]");for(var i=0;i<images.length;i++){if(images[i].complete){images[i].classList.add("is-loaded")}else{images[i].addEventListener("load",function(){this.classList.add("is-loaded")},false)}};/*]]>*/</script><div id="ai-top-regiekamer" style="display: block !important; visibility: visible !important; max-width: 900px; margin: 20px auto; background: #18181b; color: #fff; padding: 20px; border-radius: 12px; border: 1px solid #3f3f46; font-family: sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.5);"><div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #27272a; padding-bottom: 15px;"><div style="display: flex; gap: 8px; flex-wrap: wrap;"><button onclick="showMedia('muziek')" style="background: #4f46e5; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;">Muziek</button> <button onclick="showMedia('video')" style="background: #0ea5e9; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;">Video</button> <button onclick="showMedia('info')" style="background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;">Info</button> <button onclick="showMedia('prive')" style="background: #f59e0b; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;">Privé</button></div><button onclick="toggleTopChat()" style="background: #27272a; color: #38bdf8; border: 1px solid #3f3f46; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;">💬 AI Chat openen</button></div><div id="ai-top-chat-box" style="display: none; margin-top: 15px; background: #111827; border-radius: 8px; border: 1px solid #374151; overflow: hidden; flex-direction: column; height: 250px;"><div style="background: #1f2937; padding: 8px 12px; font-weight: bold; font-size: 13px; color: #9ca3af; border-bottom: 1px solid #374151;">AI-Gastheer Regiekamer</div><div id="top-chat-messages" style="flex: 1; padding: 10px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 8px;"><div style="background: #374151; padding: 6px 10px; border-radius: 6px; max-width: 90%;">Hallo! Klik op een knop hierboven of chat mee.</div></div><div style="padding: 8px; background: #1f2937; border-top: 1px solid #374151; display: flex; gap: 6px;"><input type="text" id="top-chat-input" placeholder="Typ je wens..." style="flex: 1; background: #374151; border: 1px solid #4b5563; color: white; padding: 6px; border-radius: 4px; outline: none; font-size: 13px;" onkeydown="if(event.key==='Enter') sendTopMessage()"> <button onclick="sendTopMessage()" style="background: #4f46e5; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;">Stuur</button></div></div><div id="ai-content-screen" style="display: block !important; margin-top: 15px; border-top: 1px solid #27272a; padding-top: 15px;"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;"><h3 id="ai-screen-title" style="margin: 0; font-size: 16px; color: #38bdf8;">Klaar om te starten</h3></div><div id="ai-screen-body"><p style="color: #a1a1aa; font-size: 14px; margin: 0;">Klik hierboven op **Muziek** of **Video** om de speler te laden.</p></div></div></div><script>function toggleTopChat() {
    const box = document.getElementById('ai-top-chat-box');
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  }

  function showMedia(type) {
    const title = document.getElementById('ai-screen-title');
    const body = document.getElementById('ai-screen-body');

    if (type === 'muziek') {
      title.textContent = "🎵 SoundCloud Audiospeler";
      body.innerHTML = '<iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true" style="border-radius: 8px;"></iframe>';
    } else if (type === 'video') {
      title.textContent = "🎬 YouTube Video / Playlist";
      body.innerHTML = '<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px;"><iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen></iframe></div>';
    } else {
      title.textContent = "📁 " + type.toUpperCase();
      body.innerHTML = '<p style="color: #d4d4d8;">Inhoud geladen uit je documenten of data.</p>';
    }
  }

  function sendTopMessage() {
    const input = document.getElementById('top-chat-input');
    const text = input.value.trim();
    if(!text) return;
    
    const messages = document.getElementById('top-chat-messages');
    const userDiv = document.createElement('div');
    userDiv.style.cssText = "background: #4f46e5; padding: 6px 10px; border-radius: 6px; max-width: 90%; margin-left: auto;";
    userDiv.textContent = text;
    messages.appendChild(userDiv);
    input.value = '';

    setTimeout(() => {
      const aiDiv = document.createElement('div');
      aiDiv.style.cssText = "background: #374151; padding: 6px 10px; border-radius: 6px; max-width: 90%; margin-right: auto;";
      aiDiv.textContent = "Bericht ontvangen! Ik pas het direct voor je aan.";
      messages.appendChild(aiDiv);
      messages.scrollTop = messages.scrollHeight;
    }, 500);
  }</script></body></html>
