t</label> <textarea id="emer-message" style="width: 100%; padding: 10px 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; resize: vertical;" required="" rows="6" placeholder="Typ je uitgebreide bericht hier..."></textarea></div><div><label style="display: block; font-size: 13px; margin-bottom: 6px; color: #ccc;" for="emer-photo">Foto toevoegen (alleen afbeeldingen)</label> <input type="file" id="emer-photo" accept="image/*" style="width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #bbb; font-size: 13px; box-sizing: border-box;"></div><div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;"><label style="display: flex; align-items: center; font-size: 14px; color: #ccc; cursor: pointer;"><input type="checkbox" id="emer-check-fan" style="margin-right: 8px; width: 16px; height: 16px; accent-color: #3498db; cursor: pointer;"> Ik ben fan</label> <label style="display: flex; align-items: center; font-size: 14px; color: #ccc; cursor: pointer;"><input type="checkbox" id="emer-check-never" style="margin-right: 8px; width: 16px; height: 16px; accent-color: #3498db; cursor: pointer;"> Dag en tot nooit meer</label></div><button id="emer-submit-btn" style="background: #3498db; color: white; border: none; border-radius: 4px; padding: 12px 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; margin-top: 8px;" type="submit">Bericht versturen</button></form><div id="emer-form-status" style="margin-top: 14px; font-size: 14px; display: none;"></div></div><script>(function() {
  const form = document.getElementById('emer-contact-form');
  const statusDiv = document.getElementById('emer-form-status');
  const submitBtn = document.getElementById('emer-submit-btn');
  const photoInput = document.getElementById('emer-photo');
  
  const contactWorkerUrl = 'https://contact-form-handler.brightsite-826.workers.dev';

  // Hulpfunctie om een gekozen bestand om te zetten naar Base64
  function convertFileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const name = document.getElementById('emer-name').value;
    const email = document.getElementById('emer-email').value;
    const message = document.getElementById('emer-message').value;
    const isFan = document.getElementById('emer-check-fan').checked;
    const neverAgain = document.getElementById('emer-check-never').checked;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Bezig met versturen...';
    statusDiv.style.display = 'none';

    try {
      let photoData = null;
      let photoName = null;

      if (photoInput.files && photoInput.files[0]) {
        const file = photoInput.files[0];
        photoName = file.name;
        photoData = await convertFileToBase64(file); // Bevat de Base64 string inclusief data-type
      }

      const payload = {
        name,
        email,
        message,
        isFan,
        neverAgain,
        photo: photoData,
        photoName: photoName,
        recipient: 'brecht@emer.be'
      };

      const response = await fetch(contactWorkerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        statusDiv.style.color = '#2ecc71';
        statusDiv.textContent = 'Bedankt! Je bericht en opties zijn succesvol verzonden.';
        form.reset();
      } else {
        throw new Error('Serverfout');
      }
    } catch (err) {
      statusDiv.style.color = '#e74c3c';
      statusDiv.textContent = 'Oeps, er ging iets mis bij het versturen. Probeer het later opnieuw.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Bericht versturen';
      statusDiv.style.display = 'block';
    }
  });
})();</script></div></article></main><footer id="copyright"><ul><li>© Massively</li><li>Design: <a href="https://html5up.net" target="_blank" rel="nofollow noopener">HTML5 UP</a></li><li>Powered by Publii</li></ul></footer></div><script src="https://emer.be/assets/js/jquery.min.js?v&#x3D;c9771cc3e90e18f5336eedbd0fffb2cf"></script><script src="https://emer.be/assets/js/jquery.scrollex.min.js?v&#x3D;f89065e3d988006af9791b44561d7c90"></script><script src="https://emer.be/assets/js/jquery.scrolly.min.js?v&#x3D;1ed5a78bde1476875a40f6b9ff44fc14"></script><script src="https://emer.be/assets/js/browser.min.js?v&#x3D;c07298dd19048a8a69ad97e754dfe8d0"></script><script src="https://emer.be/assets/js/breakpoints.min.js?v&#x3D;81a479eb099e3b187613943b085923b8"></script><script src="https://emer.be/assets/js/util.min.js?v&#x3D;4201a626f8c9b614a663b3a1d7d82615"></script><script src="https://emer.be/assets/js/main.min.js?v&#x3D;56233c354bd814758be8bff42f7e13a5"></script><script>/*<![CDATA[*/var images=document.querySelectorAll("img[loading]");for(var i=0;i<images.length;i++){if(images[i].complete){images[i].classList.add("is-loaded")}else{images[i].addEventListener("load",function(){this.classList.add("is-loaded")},false)}};/*]]>*/</script></body></html>
