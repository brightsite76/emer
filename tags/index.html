    const box = document.getElementById('ai-top-chat-box');
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  }

  function showMedia(type) {
    const title = document.getElementById('ai-screen-title');
    const body = document.getElementById('ai-screen-body');

    if (type === 'muziek') {
      title.textContent = "🎵 SoundCloud Audiospeler";
      body.innerHTML = '<iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true" style="border-radius: 8px;"></iframe>';
    } else if (type === 'video') {
      title.textContent = "🎬 YouTube Video / Playlist";
      body.innerHTML = '<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px;"><iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen></iframe></div>';
    } else {
      title.textContent = "📁 " + type.toUpperCase();
      body.innerHTML = '<p style="color: #d4d4d8;">Inhoud geladen uit je documenten of data.</p>';
    }
  }

  function sendTopMessage() {
    const input = document.getElementById('top-chat-input');
    const text = input.value.trim();
    if(!text) return;
    
    const messages = document.getElementById('top-chat-messages');
    const userDiv = document.createElement('div');
    userDiv.style.cssText = "background: #4f46e5; padding: 6px 10px; border-radius: 6px; max-width: 90%; margin-left: auto;";
    userDiv.textContent = text;
    messages.appendChild(userDiv);
    input.value = '';

    setTimeout(() => {
      const aiDiv = document.createElement('div');
      aiDiv.style.cssText = "background: #374151; padding: 6px 10px; border-radius: 6px; max-width: 90%; margin-right: auto;";
      aiDiv.textContent = "Bericht ontvangen! Ik pas het direct voor je aan.";
      messages.appendChild(aiDiv);
      messages.scrollTop = messages.scrollHeight;
    }, 500);
  }</script></body></html>
